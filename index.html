<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust Bro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: black;
  color: white;
}

#gate {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  z-index: 10;
}

#gate button {
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 14px 22px;
  font-size: 16px;
  cursor: pointer;
}

#scene {
  display: none;
  position: fixed;
  inset: 0;
  background: url("kurt-angle.gif") center / cover no-repeat;
}

#overlay {
  position: absolute;
  top: 14%;
  width: 100%;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  text-shadow: 0 2px 6px rgba(0,0,0,.65);
}

.line {
  opacity: 0;
  transition: opacity 0.6s ease;
}
.line.show {
  opacity: 1;
}
</style>
</head>
<body>

<div id="gate">
  <button onclick="enter()">just click me, trust bro</button>
</div>

<div id="scene">
  <div id="overlay"></div>
  <audio id="sound" src="Basement_-_Covet_(mp3.pm).mp3"></audio>
</div>

<script>
async function enter() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("scene").style.display = "block";

  // play audio (allowed after click)
  const audio = document.getElementById("sound");
  audio.volume = 0.6;
  audio.play().catch(()=>{});

  loadAndReveal();
}

async function loadAndReveal() {
  const overlay = document.getElementById("overlay");

  const res = await fetch("https://ipapi.co/json/");
  const d = await res.json();
  const now = new Date();

  const lines = [
    `IP Address: ${d.ip}`,
    `Country: ${d.country_name}`,
    `Region: ${d.region}`,
    `City: ${d.city}`,
    `ZIP Code: ${d.postal}`,
    `Latitude: ${d.latitude}`,
    `Longitude: ${d.longitude}`,
    `Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`,
    `Current Time: ${now.toLocaleString()}`,
    `ISP: ${d.org}`,
    `Screen: ${screen.width} × ${screen.height}`,
    `Window: ${window.innerWidth} × ${window.innerHeight}`,
    `Pixel Depth: ${screen.pixelDepth}`,
    `CPU Threads: ${navigator.hardwareConcurrency || "Unknown"}`
  ];

  overlay.innerHTML = "";

  lines.forEach((text, i) => {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = text;
    overlay.appendChild(div);

    setTimeout(() => {
      div.classList.add("show");
    }, 600 * i);
  });
}
</script>

</body>
</html>
